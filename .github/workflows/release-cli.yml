name: release-cli

on:
  workflow_call:
    inputs:
      version:
        description: "Version to release, without its tag's v"
        required: true
        type: string
      notes:
        description: "Release notes/changelog to include in the release body"
        required: false
        type: string
      ref:
        description: "What to build, if not the version's tag"
        required: false
        type: string
      dry_run:
        description: "Build but publish nothing"
        required: false
        type: boolean
        default: false

jobs:
  release:
    # Cross-compiles every OS's build; on macOS, so the macOS builds can be
    # signed (ad hoc), which Apple Silicon requires to run them.
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      # Always, off main.
      DRY_RUN: ${{ inputs.dry_run || github.ref_name != 'main' }}
      TAG: v${{ inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || format('v{0}', inputs.version) }}

      - name: Install dependencies
        uses: pnpm/setup@v3
        with:
          cache: true

      # A dry run builds a commit whose version rylease never wrote; the
      # binary reports and compares against the version it was built with.
      - name: Write version
        if: env.DRY_RUN == 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: pnpm pkg set "version=$VERSION"

      # Every binary and the latest.json every installed sod-off checks
      # (src/update.ts), each asset pinned to this release's tag and digest.
      - name: Build
        run: pnpm build --target all --out "$RUNNER_TEMP/cli-artifacts" --manifest --manifest-url "$MANIFEST_URL"
        env:
          MANIFEST_URL: https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}

      - name: Publish binaries
        uses: ryangarber/rylease@v2
        with:
          version: ${{ inputs.version }}
          notes: ${{ inputs.notes }}
          dry-run: ${{ env.DRY_RUN }}
          steps: |
            - uses: github-release-assets
              with:
                files: ['${{ runner.temp }}/cli-artifacts/sod-off-*']
                dryRunArtifact: true
                artifactName: cli-binaries

      # Only once every binary is up, so no CLI is told of a release it cannot
      # yet download.
      - name: Publish manifest
        uses: ryangarber/rylease@v2
        with:
          version: ${{ inputs.version }}
          notes: ${{ inputs.notes }}
          dry-run: ${{ env.DRY_RUN }}
          steps: |
            - uses: github-release-assets
              with:
                files: ['${{ runner.temp }}/cli-artifacts/latest.json']
                dryRunArtifact: true
                artifactName: cli-latest.json
