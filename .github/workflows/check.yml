name: check

on:
  push:
  workflow_dispatch:

jobs:
  check:
    # Tests that need macOS tools skip themselves elsewhere.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Installs dependencies and compiles the release binaries.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # The `install` script installs sod-off itself, not its dependencies.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build

  # No app supports Linux or Windows yet; this checks sod-off still starts
  # and says so there.
  smoketest:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run
        shell: bash
        run: |
          bun build ./src/main.ts --compile --outfile sod-off
          ./sod-off --version
          ./sod-off --help | tee help.txt
          grep -q "No apps are available" help.txt
          ./sod-off all
