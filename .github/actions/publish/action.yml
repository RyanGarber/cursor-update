name: publish
description: >-
  Uploads files to a version's GitHub release, creating the release if no
  other job has yet. A dry run publishes nothing: it prints what it would have
  published and keeps the files as a workflow artifact instead.

inputs:
  version:
    description: "The release's tag and title"
    required: true
  notes:
    description: "The release's body, should this job create it"
    required: false
    default: ""
  files:
    description: "Files to upload, one path or glob per line"
    required: true
  artifact:
    description: "The workflow artifact's name in a dry run; unique per job"
    required: true
  dry-run:
    description: "Whether to publish nothing"
    required: false
    default: "false"
  token:
    description: "A token that can write releases"
    required: true

runs:
  using: composite
  steps:
    - name: Resolve files
      id: files
      shell: bash
      env:
        PATTERNS: ${{ inputs.files }}
      run: |
        # One glob per line; only newlines split them, so names may have spaces.
        # Windows' paths take forward slashes too, where a backslash would
        # escape the glob.
        PATTERNS="${PATTERNS//\\//}"
        shopt -s nullglob
        IFS=$'\n'
        # shellcheck disable=SC2206 # globbed on purpose
        files=($PATTERNS)
        if [ "${#files[@]}" -eq 0 ]; then
          echo "::error::No files match:"$'\n'"$PATTERNS"
          exit 1
        fi
        {
          echo "list<<EOF_FILES"
          printf '%s\n' "${files[@]}"
          echo "EOF_FILES"
        } >> "$GITHUB_OUTPUT"

    - name: Upload release assets
      if: inputs.dry-run != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        VERSION: ${{ inputs.version }}
        NOTES: ${{ inputs.notes }}
        FILES: ${{ steps.files.outputs.list }}
      run: |
        # Ensure a published release exists. Create is best-effort: another
        # job may win the race; treat that as success.
        if ! gh release view "$VERSION" >/dev/null 2>&1; then
          NOTES_FILE=$(mktemp)
          printf '%s' "$NOTES" > "$NOTES_FILE"
          if ! gh release create "$VERSION" \
              --title "$VERSION" \
              --notes-file "$NOTES_FILE"; then
            gh release view "$VERSION" >/dev/null 2>&1 \
              || { echo "Failed to create or find release $VERSION"; exit 1; }
            echo "Release $VERSION already exists (create race), continuing"
          fi
        fi

        # Brief wait for API visibility after a concurrent create.
        for attempt in 1 2 3 4 5; do
          gh release view "$VERSION" >/dev/null 2>&1 && break
          if [ "$attempt" -eq 5 ]; then
            echo "Release $VERSION not visible after waiting"
            exit 1
          fi
          sleep "$attempt"
        done

        files=()
        while IFS= read -r file; do files+=("$file"); done <<< "$FILES"
        gh release upload "$VERSION" "${files[@]}" --clobber

    - name: Print release assets
      if: inputs.dry-run == 'true'
      shell: bash
      env:
        GH_REPO: ${{ github.repository }}
        VERSION: ${{ inputs.version }}
        FILES: ${{ steps.files.outputs.list }}
      run: |
        {
          echo "### Dry run: $VERSION"
          echo
          echo "Would upload to release \`$VERSION\` of \`$GH_REPO\` (kept as the \`${{ inputs.artifact }}\` artifact):"
          echo
          echo "| Asset | Size |"
          echo "| --- | --- |"
          while IFS= read -r file; do
            # GitHub stores an asset under its file name, spaces made dots.
            echo "| \`$(basename "$file" | tr ' ' '.')\` | $(du -h "$file" | cut -f1) |"
          done <<< "$FILES"
        } | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Keep release assets
      if: inputs.dry-run == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact }}
        path: ${{ steps.files.outputs.list }}
        if-no-files-found: error
        retention-days: 7
